name: Build APK
on: [push, workflow_trigger]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract Source from ZIP
        run: |
          mkdir -p app_src
          unzip -q ElysiumCrack.zip -d app_src
          # Если AIDE засунул проект в подпапку, достаем её наверх
          if [ -d "app_src/ElysiumCrack" ]; then
            mv app_src/ElysiumCrack/* .
          else
            mv app_src/* .
          fi

      - name: Overwrite with Fresh Gradle Config
        run: |
          # Удаляем старые конфиги, чтобы не мешали
          rm -f build.gradle settings.gradle gradle.properties gradlew
          rm -rf gradle

          # Пишем свой корневой build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Пишем свой settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "ElysiumCrack"
          include ':app'
          EOF

          # Пишем app/build.gradle (если AIDE не создал папку app, создаем)
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.elysium.crack'
              compileSdk 33
              defaultConfig {
                  applicationId "com.elysium.crack"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
          }
          EOF

      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElysiumCrack-debug
          path: app/build/outputs/apk/debug/*.apk
